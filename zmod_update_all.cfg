# zmod_update_all: an update queue. Installs every available update, then
# reboots as few times as possible.
#
#   UPDATE_ALL             refresh, install every update, reboot when needed
#   UPDATE_ALL CHECK=1     only list the available updates
#   UPDATE_ALL REBOOT=0    plugins only, leave the reboot to you
#   UPDATE_ALL CANCEL=1    drop a queue that is waiting for a reboot
#
# Z-Mod, klippy and moon reboot the printer by themselves when they update.
# The queue is saved before each of them and _UPDATE_ALL_RESUME carries on
# after the boot, so a run with all three takes three reboots, hands-off.
#
# Progress appears in the console. Full log: /tmp/zmod_update_all.log inside
# Zmod's chroot (/usr/data/.mod/.zmod/tmp/zmod_update_all.log on the host).

[gcode_shell_command zmod_update_all]
command: chroot /usr/data/.mod/.zmod python3 /root/printer_data/config/mod_data/plugins/zmod_update_all/update_all.py
timeout: 30
verbose: True

[gcode_shell_command zmod_update_all_resume]
command: chroot /usr/data/.mod/.zmod python3 /root/printer_data/config/mod_data/plugins/zmod_update_all/update_all.py --resume
timeout: 30
verbose: False

[gcode_macro UPDATE_ALL]
description: Install every available update, then reboot as few times as needed
gcode:
    {% if params.CANCEL|default(0)|int %}
        RUN_SHELL_COMMAND CMD=zmod_update_all PARAMS="--cancel"
    {% else %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            {action_raise_error("UPDATE_ALL: not while a print is running")}
        {% endif %}
        {% set check = "--check" if params.CHECK|default(0)|int else "" %}
        {% set reboot = "" if params.REBOOT|default(1)|int else "--no-reboot" %}
        RUN_SHELL_COMMAND CMD=zmod_update_all PARAMS="{check} {reboot}"
    {% endif %}

[gcode_macro _UPDATE_ALL_MSG]
gcode:
    {action_respond_info("UPDATE_ALL: " ~ params.MSG|default(""))}

# Carries on with a saved queue after a reboot. Does nothing (and prints
# nothing) when no queue is waiting.
[delayed_gcode _UPDATE_ALL_RESUME]
initial_duration: 15
gcode:
    RUN_SHELL_COMMAND CMD=zmod_update_all_resume
